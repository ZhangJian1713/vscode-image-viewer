<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src $webviewCspSource$ data: blob:; connect-src $webviewCspSource$; font-src $webviewCspSource$ data:; style-src $webviewCspSource$ 'unsafe-inline'; script-src 'nonce-$webviewNonce$';" />
  <title>easy-vscode-webview</title>
  <script type="text/javascript"> window.currentView = '$currentView$' </script>
  <script type="text/javascript"> window.vscodeEnv = $vscodeEnv$ </script>
  <script type="text/javascript"> window.commandArgs = $commandArgs$ </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
